[package]
name = "wreck-adapters"
version = "0.1.0"
edition = "2021"

[dependencies]
wreck-protocol = { path = "../wreck-protocol" }
wreck-graph = { path = "../wreck-graph" }
wreck-governor = { path = "../wreck-governor" }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
serde = { version = "1", features = ["derive"] }
